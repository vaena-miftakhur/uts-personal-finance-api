services:
  postgres-db:
    image: postgres:16-alpine
    container_name: uts_postgre_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rahasia
      POSTGRES_DB: personal_finance_db
    ports:
      - "5433:5432"
    volumes:
      - uts_postgres_data:/var/lib/postgresql/data

volumes:
  uts_postgres_data: